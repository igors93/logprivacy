[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "logprivacy"
version = "0.2.0"
description = "Zero-dependency privacy-first log redaction for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LogPrivacy Contributors" }]
keywords = ["logs", "privacy", "redaction", "security", "masking", "pii"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.7", "mypy>=1.10"]

[project.scripts]
logprivacy = "logprivacy.__main__:main"

[project.urls]
Homepage = "https://github.com/igors93/logprivacy"
Repository = "https://github.com/igors93/logprivacy"
Documentation = "https://github.com/igors93/logprivacy/tree/main/docs"
Issues = "https://github.com/igors93/logprivacy/issues"
Changelog = "https://github.com/igors93/logprivacy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/logprivacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
