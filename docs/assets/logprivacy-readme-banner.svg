<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="30%"  stop-color="#388bfd"/>
      <stop offset="70%"  stop-color="#56d364"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="sf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.54  0 0 0 0 1  0 0 0 0.6 0"
        in="b" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Dot grid (decorative, left half) -->
  <g fill="#58a6ff" opacity="0.07">
    <circle cx="20"  cy="20"  r="1.5"/><circle cx="60"  cy="20"  r="1.5"/><circle cx="100" cy="20"  r="1.5"/>
    <circle cx="140" cy="20"  r="1.5"/><circle cx="180" cy="20"  r="1.5"/><circle cx="220" cy="20"  r="1.5"/>
    <circle cx="260" cy="20"  r="1.5"/><circle cx="300" cy="20"  r="1.5"/><circle cx="340" cy="20"  r="1.5"/>
    <circle cx="380" cy="20"  r="1.5"/><circle cx="420" cy="20"  r="1.5"/><circle cx="460" cy="20"  r="1.5"/>
    <circle cx="500" cy="20"  r="1.5"/><circle cx="540" cy="20"  r="1.5"/><circle cx="580" cy="20"  r="1.5"/>
    <circle cx="620" cy="20"  r="1.5"/><circle cx="660" cy="20"  r="1.5"/>

    <circle cx="20"  cy="60"  r="1.5"/><circle cx="60"  cy="60"  r="1.5"/><circle cx="100" cy="60"  r="1.5"/>
    <circle cx="140" cy="60"  r="1.5"/><circle cx="180" cy="60"  r="1.5"/><circle cx="220" cy="60"  r="1.5"/>
    <circle cx="260" cy="60"  r="1.5"/><circle cx="300" cy="60"  r="1.5"/><circle cx="340" cy="60"  r="1.5"/>
    <circle cx="380" cy="60"  r="1.5"/><circle cx="420" cy="60"  r="1.5"/><circle cx="460" cy="60"  r="1.5"/>
    <circle cx="500" cy="60"  r="1.5"/><circle cx="540" cy="60"  r="1.5"/><circle cx="580" cy="60"  r="1.5"/>
    <circle cx="620" cy="60"  r="1.5"/><circle cx="660" cy="60"  r="1.5"/>

    <circle cx="20"  cy="100" r="1.5"/><circle cx="60"  cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/>
    <circle cx="140" cy="100" r="1.5"/><circle cx="180" cy="100" r="1.5"/><circle cx="220" cy="100" r="1.5"/>
    <circle cx="260" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="340" cy="100" r="1.5"/>
    <circle cx="380" cy="100" r="1.5"/><circle cx="420" cy="100" r="1.5"/><circle cx="460" cy="100" r="1.5"/>
    <circle cx="500" cy="100" r="1.5"/><circle cx="540" cy="100" r="1.5"/><circle cx="580" cy="100" r="1.5"/>
    <circle cx="620" cy="100" r="1.5"/><circle cx="660" cy="100" r="1.5"/>

    <circle cx="20"  cy="140" r="1.5"/><circle cx="60"  cy="140" r="1.5"/><circle cx="100" cy="140" r="1.5"/>
    <circle cx="140" cy="140" r="1.5"/><circle cx="180" cy="140" r="1.5"/><circle cx="220" cy="140" r="1.5"/>
    <circle cx="260" cy="140" r="1.5"/><circle cx="300" cy="140" r="1.5"/><circle cx="340" cy="140" r="1.5"/>
    <circle cx="380" cy="140" r="1.5"/><circle cx="420" cy="140" r="1.5"/><circle cx="460" cy="140" r="1.5"/>
    <circle cx="500" cy="140" r="1.5"/><circle cx="540" cy="140" r="1.5"/><circle cx="580" cy="140" r="1.5"/>
    <circle cx="620" cy="140" r="1.5"/><circle cx="660" cy="140" r="1.5"/>

    <circle cx="20"  cy="180" r="1.5"/><circle cx="60"  cy="180" r="1.5"/><circle cx="100" cy="180" r="1.5"/>
    <circle cx="140" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="220" cy="180" r="1.5"/>
    <circle cx="260" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/><circle cx="340" cy="180" r="1.5"/>
    <circle cx="380" cy="180" r="1.5"/><circle cx="420" cy="180" r="1.5"/><circle cx="460" cy="180" r="1.5"/>
    <circle cx="500" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/><circle cx="580" cy="180" r="1.5"/>
    <circle cx="620" cy="180" r="1.5"/><circle cx="660" cy="180" r="1.5"/>

    <circle cx="20"  cy="220" r="1.5"/><circle cx="60"  cy="220" r="1.5"/><circle cx="100" cy="220" r="1.5"/>
    <circle cx="140" cy="220" r="1.5"/><circle cx="180" cy="220" r="1.5"/><circle cx="220" cy="220" r="1.5"/>
    <circle cx="260" cy="220" r="1.5"/><circle cx="300" cy="220" r="1.5"/><circle cx="340" cy="220" r="1.5"/>
    <circle cx="380" cy="220" r="1.5"/><circle cx="420" cy="220" r="1.5"/><circle cx="460" cy="220" r="1.5"/>
    <circle cx="500" cy="220" r="1.5"/><circle cx="540" cy="220" r="1.5"/><circle cx="580" cy="220" r="1.5"/>
    <circle cx="620" cy="220" r="1.5"/><circle cx="660" cy="220" r="1.5"/>

    <circle cx="20"  cy="260" r="1.5"/><circle cx="60"  cy="260" r="1.5"/><circle cx="100" cy="260" r="1.5"/>
    <circle cx="140" cy="260" r="1.5"/><circle cx="180" cy="260" r="1.5"/><circle cx="220" cy="260" r="1.5"/>
    <circle cx="260" cy="260" r="1.5"/><circle cx="300" cy="260" r="1.5"/><circle cx="340" cy="260" r="1.5"/>
    <circle cx="380" cy="260" r="1.5"/><circle cx="420" cy="260" r="1.5"/><circle cx="460" cy="260" r="1.5"/>
    <circle cx="500" cy="260" r="1.5"/><circle cx="540" cy="260" r="1.5"/><circle cx="580" cy="260" r="1.5"/>
    <circle cx="620" cy="260" r="1.5"/><circle cx="660" cy="260" r="1.5"/>
