  <!-- Shield icon -->
  <g transform="translate(52,56)" filter="url(#sf)">
    <path d="M 78,0 L 5,32 L 5,95 C 5,138 37,168 78,186 C 119,168 151,138 151,95 L 151,32 Z"
          fill="url(#sg)" opacity="0.20"/>
    <path d="M 78,0 L 5,32 L 5,95 C 5,138 37,168 78,186 C 119,168 151,138 151,95 L 151,32 Z"
          fill="none" stroke="url(#sg)" stroke-width="2.5"/>
    <path d="M 30,98 L 65,134 L 128,65"
          fill="none" stroke="#56d364" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="240" y="136"
        font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif"
        font-size="72" font-weight="800"
        fill="url(#tg)">LogPrivacy</text>

  <!-- Tagline -->
  <text x="244" y="172"
        font-family="'Segoe UI','SF Pro Text',system-ui,sans-serif"
        font-size="16" fill="#8b949e" letter-spacing="0.3">
    Zero-dependency privacy-first log redaction for Python
  </text>

  <!-- Badges -->
  <rect x="244" y="188" width="118" height="22" rx="11" fill="#152440"/>
  <text x="303"  y="203" font-family="system-ui,sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Python 3.10 – 3.14</text>

  <rect x="370" y="188" width="90"  height="22" rx="11" fill="#122312"/>
  <text x="415"  y="203" font-family="system-ui,sans-serif" font-size="11" fill="#56d364" text-anchor="middle">Zero deps</text>

  <rect x="468" y="188" width="62"  height="22" rx="11" fill="#1f1635"/>
  <text x="499"  y="203" font-family="system-ui,sans-serif" font-size="11" fill="#bc8cff" text-anchor="middle">MIT License</text>

  <rect x="538" y="188" width="82"  height="22" rx="11" fill="#152440"/>
  <text x="579"  y="203" font-family="system-ui,sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Fully Typed</text>

  <!-- Vertical divider -->
  <line x1="688" y1="35" x2="688" y2="265" stroke="#21262d" stroke-width="1.5"/>

  <!-- Code panel -->
  <rect x="708" y="35" width="468" height="232" rx="8" fill="#161b22"/>
  <rect x="708" y="35" width="468" height="232" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Panel header -->
  <rect x="708" y="35" width="468" height="34" rx="8" fill="#1f2428"/>
  <rect x="708" y="55" width="468" height="14" fill="#1f2428"/>

  <!-- Terminal buttons -->
  <circle cx="731" cy="52" r="5.5" fill="#ff5f57"/>
  <circle cx="749" cy="52" r="5.5" fill="#febc2e"/>
  <circle cx="767" cy="52" r="5.5" fill="#28c840"/>

  <!-- Panel title -->
  <text x="790" y="57"
        font-family="'Consolas','Courier New',monospace"
        font-size="12" fill="#6e7681">
    from logprivacy import clean
  </text>

  <!-- Separator -->
  <line x1="708" y1="69" x2="1176" y2="69" stroke="#30363d" stroke-width="1"/>

  <!-- Code comment -->
  <text x="724" y="96"
        font-family="'Consolas','Courier New',monospace"
        font-size="12" fill="#6e7681">
    # before                         after
  </text>

  <!-- Line 1 -->
  <text x="724" y="120" font-family="'Consolas','Courier New',monospace" font-size="13">
    <tspan fill="#ff7b72">password=s3cr3t       </tspan>
    <tspan fill="#484f58">&#x2192; </tspan>
    <tspan fill="#56d364">password=</tspan><tspan fill="#79c0ff">[SECRET]</tspan>
  </text>

  <!-- Line 2 -->
  <text x="724" y="146" font-family="'Consolas','Courier New',monospace" font-size="13">
    <tspan fill="#ff7b72">email: user@corp.com  </tspan>
    <tspan fill="#484f58">&#x2192; </tspan>
    <tspan fill="#56d364">email: </tspan><tspan fill="#79c0ff">[EMAIL]</tspan>
  </text>

  <!-- Line 3 -->
  <text x="724" y="172" font-family="'Consolas','Courier New',monospace" font-size="13">
    <tspan fill="#ff7b72">Bearer eyJhbGciOiJI… </tspan>
    <tspan fill="#484f58">&#x2192; </tspan>
    <tspan fill="#79c0ff">[TOKEN]</tspan>
  </text>

  <!-- Line 4 -->
  <text x="724" y="198" font-family="'Consolas','Courier New',monospace" font-size="13">
    <tspan fill="#ff7b72">4111 1111 1111 1111   </tspan>
    <tspan fill="#484f58">&#x2192; </tspan>
    <tspan fill="#79c0ff">[CREDIT_CARD]</tspan>
  </text>

  <!-- Line 5 -->
  <text x="724" y="224" font-family="'Consolas','Courier New',monospace" font-size="13">
    <tspan fill="#ff7b72">api_key=sk_live_abc… </tspan>
    <tspan fill="#484f58">&#x2192; </tspan>
    <tspan fill="#56d364">api_key=</tspan><tspan fill="#79c0ff">[SECRET]</tspan>
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="294" width="1200" height="4" fill="url(#bl)"/>
</svg>
